<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="380" fill="#ffffff"/>

  <!-- suelo -->
  <line x1="40" y1="330" x2="660" y2="330" stroke="#c9d3dc" stroke-width="2"/>

  <!-- silla -->
  <rect x="130" y="250" width="90" height="14" rx="4" fill="#7d8b9a"/>
  <rect x="130" y="150" width="14" height="115" rx="4" fill="#7d8b9a"/>
  <line x1="150" y1="264" x2="150" y2="330" stroke="#7d8b9a" stroke-width="8"/>
  <line x1="200" y1="264" x2="200" y2="330" stroke="#7d8b9a" stroke-width="8"/>

  <!-- persona sentada -->
  <circle cx="205" cy="130" r="22" fill="#1b3a5c"/>
  <path d="M 175 250 Q 175 175 205 155 Q 235 175 235 250 Z" fill="#1b3a5c"/>
  <path d="M 205 165 Q 260 175 275 210" stroke="#1b3a5c" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- linea de vision (altura de ojos) -->
  <line x1="205" y1="122" x2="470" y2="122" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6,5"/>
  <circle cx="205" cy="122" r="3" fill="#14b8a6"/>

  <!-- escritorio -->
  <rect x="260" y="248" width="360" height="12" fill="#c9d3dc"/>
  <line x1="280" y1="260" x2="280" y2="330" stroke="#c9d3dc" stroke-width="8"/>
  <line x1="590" y1="260" x2="590" y2="330" stroke="#c9d3dc" stroke-width="8"/>

  <!-- monitor -->
  <rect x="400" y="90" width="150" height="100" rx="6" fill="#1b3a5c"/>
  <rect x="410" y="100" width="130" height="80" rx="2" fill="#e8f6f4"/>
  <rect x="463" y="190" width="24" height="30" fill="#7d8b9a"/>
  <rect x="440" y="220" width="70" height="10" rx="3" fill="#7d8b9a"/>

  <!-- flecha de distancia 40cm -->
  <line x1="280" y1="140" x2="400" y2="140" stroke="#c0392b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="340" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">40 cm</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b3a5c">Distancia mínima recomendada al monitor</text>
  <text x="350" y="365" text-anchor="middle" font-size="14" fill="#5a6b7a">La parte superior de la pantalla debe quedar a la altura de los ojos, y a unos 40 cm de distancia como mínimo.</text>
</svg>
