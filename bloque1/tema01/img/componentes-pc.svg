<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- caja del PC -->
  <rect x="30" y="30" width="640" height="360" rx="10" fill="#f4f7f9" stroke="#c9d3dc" stroke-width="2"/>
  <text x="350" y="20" text-anchor="middle" font-size="14" fill="#5a6b7a">CAJA DEL ORDENADOR</text>

  <!-- placa base -->
  <rect x="60" y="70" width="360" height="290" rx="6" fill="#1b3a5c"/>
  <text x="240" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">PLACA BASE</text>
  <text x="240" y="112" text-anchor="middle" font-size="11" fill="#cfe3ee">conecta y comunica todo lo demás</text>

  <!-- ranuras RAM sobre la placa -->
  <rect x="90" y="135" width="18" height="90" fill="#14b8a6"/>
  <rect x="118" y="135" width="18" height="90" fill="#14b8a6"/>
  <text x="113" y="240" text-anchor="middle" font-size="11" fill="#ffffff">RAM</text>
  <text x="113" y="253" text-anchor="middle" font-size="9" fill="#cfe3ee">(DIMM / SO-DIMM)</text>

  <!-- CPU en la placa -->
  <rect x="180" y="150" width="70" height="70" fill="#e8f6f4" stroke="#14b8a6" stroke-width="2"/>
  <text x="215" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3a5c">CPU</text>

  <!-- conectores de expansion -->
  <rect x="290" y="300" width="110" height="16" fill="#7d8b9a"/>
  <text x="345" y="335" text-anchor="middle" font-size="10" fill="#cfe3ee">ranuras de expansión</text>

  <!-- fuente de alimentacion -->
  <rect x="470" y="70" width="150" height="80" rx="6" fill="#c0392b"/>
  <text x="545" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">FUENTE DE</text>
  <text x="545" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ALIMENTACIÓN</text>
  <text x="545" y="140" text-anchor="middle" font-size="10" fill="#fddede">240V AC → DC</text>

  <!-- almacenamiento -->
  <rect x="470" y="180" width="150" height="80" rx="6" fill="#8e5a2b"/>
  <text x="545" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ALMACENAMIENTO</text>
  <text x="545" y="235" text-anchor="middle" font-size="10" fill="#f0dcc7">SSD / HDD / óptico</text>

  <!-- cables de conexion -->
  <line x1="420" y1="110" x2="470" y2="110" stroke="#5a6b7a" stroke-width="4"/>
  <line x1="420" y1="220" x2="470" y2="220" stroke="#5a6b7a" stroke-width="4"/>

  <text x="350" y="405" text-anchor="middle" font-size="13" fill="#5a6b7a">Los 4 componentes imprescindibles para que un ordenador pueda arrancar</text>
</svg>
